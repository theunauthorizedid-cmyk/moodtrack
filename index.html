<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MoodTrack</title>
<meta name="description" content="Safe / Unsafe mind-state tracker">
<meta name="theme-color" content="#F6F1E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MoodTrack">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{height:100%;margin:0;background:#F6F1E9;overscroll-behavior:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input,textarea{-webkit-user-select:text;user-select:text}
  #root{display:flex;height:100%;flex:1;max-width:520px;margin:0 auto}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:700 12px/1 Menlo,monospace;letter-spacing:.14em;color:#7A6E60}
</style>
</head>
<body>
<div id="boot">MOODTRACK</div>
<div id="root"></div>
<script src="app.js" defer></script>
<script>
  // Keep the boot label until the app paints; ask the browser to keep this app's data.
  new MutationObserver(function(_, o){ if(document.getElementById('root').childElementCount){ var b=document.getElementById('boot'); b&&b.remove(); o.disconnect(); } })
    .observe(document.getElementById('root'), {childList:true});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
</script>
</body>
</html>
