name: MoodTrack hourly reminders
on:
  schedule:
    - cron: '0 * * * *'          # every hour (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now even in quiet hours (test)'
        type: boolean
        default: true
permissions:
  contents: write                # only for the monthly keep-alive commit below
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save web-push@3.6.7
      - name: Send reminder
        run: node scripts/send-reminders.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS || '23:30-07:30' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without commits; a tiny commit on the 1st of each month prevents that.
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0103" ]; then
            date -u > .github/keepalive
            git config user.name "moodtrack-bot"; git config user.email "actions@users.noreply.github.com"
            git add .github/keepalive && git commit -m "keep reminders schedule alive" && git push || true
          fi
